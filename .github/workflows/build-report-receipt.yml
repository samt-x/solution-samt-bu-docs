name: Kvittering på melding om feilet bygg

# Svarer med en gang når noen kommenterer på #83 («Meld fra her» i nettleseren lenker dit),
# med takk og status for bygget akkurat nå (punkt C2 i #83).
# Kommentarer fra dem som følger opp (lista i if under) og fra botene får ikke kvittering.
# Svaret postes med GITHUB_TOKEN, og slike kommentarer starter ingen nye kjøringer.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  receipt:
    if: >-
      github.event.issue.number == 83 &&
      github.event.comment.user.type != 'Bot' &&
      !contains(fromJSON('["samt-x-bot", "erikhag1git"]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Svar med status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: python3 .github/scripts/build-report-receipt.py
